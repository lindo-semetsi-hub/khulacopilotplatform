<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Records | Khula AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-wrap">

<h1>Crop Lifecycle Records</h1>
<p>Capture and track the complete lifecycle of every crop on your farm.</p>

<form id="crop-form">

<label>Crop Name</label>
<input type="text" id="cropName" required>

<label>Crop Variety</label>
<input type="text" id="cropVariety" required>

<label>Planting Date</label>
<input type="date" id="plantingDate" required>

<label>Seed Type</label>
<input type="text" id="seedType">

<label>Seed Supplier</label>
<input type="text" id="seedSupplier">

<label>Fertilizer Used</label>
<input type="text" id="fertilizerUsed">

<label>Irrigation Method</label>
<input type="text" id="irrigationMethod">

<label>Current Growth Stage</label>
<select id="growthStage">
<option>Seeded</option>
<option>Germination</option>
<option>Vegetative</option>
<option>Flowering</option>
<option>Fruit Development</option>
<option>Ready For Harvest</option>
</select>

<label>Expected Harvest Date</label>
<input type="date" id="harvestDate">

<label>Notes</label>
<textarea id="notes"></textarea>

<button type="submit">Save Crop Record</button>

</form>

<h2>Saved Crop Records</h2>
<div id="crop-list"></div>

</div>

<script>
function loadCrops(){
 const crops = JSON.parse(localStorage.getItem('cropRecords')) || [];
 const cropList = document.getElementById('crop-list');
 cropList.innerHTML = '';

 crops.forEach((crop,index)=>{
  cropList.innerHTML += `
   <div class="crop-card">
    <h3>${crop.cropName}</h3>
    <p><strong>Variety:</strong> ${crop.cropVariety}</p>
    <p><strong>Planting Date:</strong> ${crop.plantingDate}</p>
    <p><strong>Growth Stage:</strong> ${crop.growthStage}</p>
    <p><strong>Expected Harvest:</strong> ${crop.harvestDate}</p>
    <p><strong>Fertilizer:</strong> ${crop.fertilizerUsed}</p>
   </div>`;
 });
}

document.getElementById('crop-form').addEventListener('submit', function(e){
 e.preventDefault();

 const crop = {
  cropName: cropName.value,
  cropVariety: cropVariety.value,
  plantingDate: plantingDate.value,
  seedType: seedType.value,
  seedSupplier: seedSupplier.value,
  fertilizerUsed: fertilizerUsed.value,
  irrigationMethod: irrigationMethod.value,
  growthStage: growthStage.value,
  harvestDate: harvestDate.value,
  notes: notes.value
 };

 const crops = JSON.parse(localStorage.getItem('cropRecords')) || [];
 crops.push(crop);
 localStorage.setItem('cropRecords', JSON.stringify(crops));

 alert('Crop record saved successfully');
 document.getElementById('crop-form').reset();
 loadCrops();
});

loadCrops();
</script>

</body>
</html>
